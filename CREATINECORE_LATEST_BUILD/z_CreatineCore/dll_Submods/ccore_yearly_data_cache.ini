; ccore_yearly_data_cache.dll settings.
; Once per game year copies saved_country_supply, domestic_demand_pool, actual_sold_domestic and the
; country stockpile of every country from a game save into z_CreatineCore\Cache\ (one text file per year).
; The game itself writes the save, so its autosave must be on (or save by hand); only the first save of every
; campaign year is taken. When Cache is over 50 MB, files older than a month are deleted (younger ones never).

; 1 = watch the save folder and fill the cache, 0 = the module does nothing
ENABLE=0
