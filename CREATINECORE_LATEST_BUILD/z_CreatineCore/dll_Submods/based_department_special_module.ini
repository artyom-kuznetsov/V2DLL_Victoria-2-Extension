; 0 = module does nothing
ENABLE=1

; 1 = the focus no longer increases the number of promoting/demoting pops (vanilla adds the focus value
; to the promotion and demotion rate)
REMOVE_FOCUS_AMOUNT_BONUS=1

; 1 = keep the vanilla rule that pops that already are of the focused type never promote away.
; 0 = they promote like any other pop (the focus then only changes the chance).
KEEP_FOCUS_TYPE_PROMOTION_BLOCK=0
