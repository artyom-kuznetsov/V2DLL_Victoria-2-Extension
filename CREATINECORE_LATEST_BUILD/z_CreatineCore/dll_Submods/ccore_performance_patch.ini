; ccore_performance_patch.dll settings. These change the simulation or the engine timing, so every player
; of a multiplayer game must use the same values (creatinecore.dll hashes them into the config fingerprint).

; FPU control word pinned at the start of the main loop
PATCH_FPU_FORTRESS=1
; D3DCREATE_FPU_PRESERVE for the D3D9 device
PATCH_D3D_FPU_PRESERVE=1
; Low Fragmentation Heap on the process heaps
PATCH_HEAP_LFH=1
; FPU pin at the start of every thread created by the exe / tbb.dll
PATCH_THREAD_FPU_PIN=1
; cap of the TBB worker pool, 0 = leave the game's own choice (all cores)
ENGINE_WORKER_THREADS=0
; round the low fractional bits of pop money / needs after the daily pass
PATCH_POP_QUANTIZE=1
; fractional bits kept (15 = vanilla, no rounding)
POP_QUANTIZE_KEEP_BITS=12
; Sleep()/WaitForSingleObject() clamps, shorter main loop sleep, MP client pump
REMOVE_SLEEPERS=1
; force PresentationInterval=IMMEDIATE (may cause tearing / stutters)
PATCH_D3D_NO_VSYNC=0
; soft FPS limit, 0 = off
D3D_FPS_LIMIT=70
; select() of the sound mixer 14-20 ms -> 1 ms
FIX_SFX_MIXER_LAG=1
; ABOVE_NORMAL priority, no power throttling
PATCH_HIGH_PRIORITY=1
; skip the nested in-game idle pass while units are selected (army window stutters)
FIX_ARMY_WINDOW_LAG=0

; extra diagnostic lines in v2dll.log
DEBUG_LOG=1
